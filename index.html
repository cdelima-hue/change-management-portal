<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal de Gestión de Changes • Enterprise v6.0</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="p-2 sm:p-4 bg-slate-50 min-h-screen">

  <script>
    // Forzar rol de Administrador Global en sesión local antes de renderizar
    window.forzarLoginAdmin = function() {
      const adminUser = {
        id: 1,
        username: 'admin',
        nombre: 'Claudio Lima (SuperAdmin)',
        usuario: 'Claudio Lima',
        role: 'Administrador',
        rol: 'Administrador',
        perfil: 'Admin Global',
        role_id: 'admin',
        type: 'admin',
        esAdmin: true,
        isAdmin: true,
        activo: true
      };
      localStorage.setItem('isLoggedIn', 'true');
      localStorage.setItem('currentUser', JSON.stringify(adminUser));
      sessionStorage.setItem('currentUser', JSON.stringify(adminUser));
      
      const loginContainer = document.getElementById('loginContainer');
      const appContainer = document.getElementById('appContainer');
      if (loginContainer) loginContainer.classList.add('hidden');
      if (appContainer) appContainer.classList.remove('hidden');
      
      if (typeof window.inicializarApp === 'function') window.inicializarApp();
      if (typeof window.cargarDatos === 'function') window.cargarDatos();
    };
  </script>

  <!-- PANTALLA DE LOGIN -->
  <div id="loginContainer" class="fixed inset-0 z-50 flex items-center justify-center bg-gradient-to-br from-slate-900 via-blue-950 to-slate-900 p-4">
    <div class="w-full max-w-md bg-white rounded-3xl shadow-2xl border border-slate-100 p-6 sm:p-8 relative overflow-hidden">
      <div class="text-center mb-6 mt-2">
        <h2 class="text-xl font-black text-slate-900 tracking-tight">Portal de Gestión de Changes</h2>
        <p class="text-xs text-slate-500 mt-1">Inicia sesión para acceder al sistema de gestión y capacidad</p>
      </div>

      <form id="loginForm" onsubmit="event.preventDefault(); window.forzarLoginAdmin();">
        <div class="mb-4">
          <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Usuario o Correo Electrónico</label>
          <input type="text" id="loginUsername" value="admin" class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs font-semibold focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <div class="mb-5">
          <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Contraseña</label>
          <input type="password" id="loginPassword" value="Nestle2026!" class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs font-semibold focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <button type="submit" class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl shadow-lg shadow-blue-500/20 text-xs transition-all flex items-center justify-center gap-2">
          <i class="fas fa-sign-in-alt"></i> Iniciar Sesión
        </button>
      </form>

      <div class="mt-6 pt-5 border-t border-slate-100 text-center">
        <p class="text-[11px] font-bold text-slate-400 mb-2">Credenciales de demostración rápida:</p>
        <div class="grid grid-cols-3 gap-2">
          <button type="button" onclick="window.forzarLoginAdmin();" class="p-2 bg-slate-50 hover:bg-blue-50 border border-slate-200 rounded-xl text-[11px] font-bold text-slate-700">Admin Global</button>
          <button type="button" onclick="window.forzarLoginAdmin();" class="p-2 bg-slate-50 hover:bg-blue-50 border border-slate-200 rounded-xl text-[11px] font-bold text-slate-700">México</button>
          <button type="button" onclick="window.forzarLoginAdmin();" class="p-2 bg-slate-50 hover:bg-blue-50 border border-slate-200 rounded-xl text-[11px] font-bold text-slate-700">Brasil</button>
        </div>
      </div>
    </div>
  </div>

  <!-- APLICACIÓN PRINCIPAL (NATIVA ORIGINAL) -->
  <div id="appContainer" class="hidden"></div>

  <!-- SCRIPTS NATIVOS -->
  <script src="api.js"></script>
  <script src="branding.js"></script>
  <script src="config_paises.js"></script>
  <script src="i18n.js"></script>
  <script src="sla.js"></script>
  <script src="auth.js"></script>
  <script src="app.js"></script>
</body>
</html>
