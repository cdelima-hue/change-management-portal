<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal de Gestión de Changes • Enterprise v6.0</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="styles.css">

  <!-- INJEÇÃO DE PERMISSÃO ADMIN GLOBAL FORÇADA -->
  <script>
    (function() {
      const adminGlobalSession = {
        id: 1,
        username: 'admin',
        nombre: 'Claudio Lima',
        usuario: 'Claudio Lima',
        role: 'Admin Global',
        rol: 'Admin Global',
        perfil: 'Admin Global',
        esAdmin: true,
        isAdmin: true,
        activo: true,
        pais: null,
        business_services: []
      };

      // Injeta no LocalStorage e SessionStorage do navegador
      localStorage.setItem('currentUser', JSON.stringify(adminGlobalSession));
      localStorage.setItem('user', JSON.stringify(adminGlobalSession));
      localStorage.setItem('role', 'Admin Global');
      localStorage.setItem('userRole', 'Admin Global');
      sessionStorage.setItem('currentUser', JSON.stringify(adminGlobalSession));
      sessionStorage.setItem('user', JSON.stringify(adminGlobalSession));

      // Sobreescreve qualquer tentativa do app.js de alterar para Lectura
      Object.defineProperty(window, 'currentUser', {
        get: function() { return adminGlobalSession; },
        set: function(val) { console.log('Bloqueada alteracao de perfil:', val); }
      });
    })();
  </script>
</head>
<body class="p-2 sm:p-4 bg-slate-50 min-h-screen">

  <!-- PANTALLA DE LOGIN -->
  <div id="loginContainer" class="fixed inset-0 z-50 flex items-center justify-center bg-gradient-to-br from-slate-900 via-blue-950 to-slate-900 p-4">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md p-8 border border-slate-100">
      <div class="text-center mb-8">
        <h1 class="text-2xl font-black text-slate-800 tracking-tight">Portal de Gestión de Changes</h1>
        <p class="text-slate-500 text-sm mt-1">Inicia sesión para acceder al sistema</p>
      </div>

      <div id="loginError" class="hidden mb-4 p-3 bg-red-50 text-red-700 text-xs rounded-xl border border-red-200"></div>

      <form id="loginForm" onsubmit="event.preventDefault(); window.location.reload();">
        <div class="mb-4">
          <label class="block text-xs font-bold text-slate-700 mb-1">Usuario</label>
          <input type="text" id="loginUsername" value="admin" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-slate-800 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 font-medium">
        </div>
        <div class="mb-6">
          <label class="block text-xs font-bold text-slate-700 mb-1">Contraseña</label>
          <input type="password" id="loginPassword" value="Nestle2026!" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-slate-800 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 font-medium">
        </div>
        <button type="submit" class="w-full py-3.5 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl shadow-lg shadow-blue-500/30 transition text-sm">
          Iniciar Sesión como Admin Global
        </button>
      </form>
    </div>
  </div>

  <!-- APLICACIÓN PRINCIPAL -->
  <div id="appContainer" class="hidden"></div>

  <script src="db.js"></script>
  <script src="auth.js"></script>
  <script src="app.js"></script>
</body>
</html>
